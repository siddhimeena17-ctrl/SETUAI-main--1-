name: Web CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Lint, Typecheck, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Verify
        run: npm run verify
